/* TPM premium iteration — overrides only, preserving existing semantic burgundy palette. */
:root{--premium-shadow:0 1px 1px rgba(36,41,48,.016),0 6px 24px rgba(36,41,48,.028);--premium-ink:#22252b;--premium-line:#e7e7e9}

.c-body{padding:32px 0 75px}.c-section{margin-top:26px}

function materialsD(){return `${header('Material ledger','Inventory IDs, allocations, consumption and traceability in dense tables.')}<div class="d-data">${card('Allocated coils',table(['Coil','Heat','Work #','Received','Weight'],coilAlloc))}</div><div class="d-data">${card('Used coils',table(['Coil','Heat','Work #','Tubes','Tube range','Used'],coilUsed))}</div><div class="d-data">${card('Mesh allocations',table(['Mesh','Heat','Type','Spec'],meshAlloc))}</div><div class="d-data">${card('Mesh consumed',table(['Mesh','Heat','Type','Spec'],meshUsed))}</div><div class="d-data">${card('Tube traceability',table(['Tube','Coil','Mill','Cutoff','Inspection','Mill time','Cutoff time','Inspect time'],tubeRows))}</div><div class="d-data">${card('Material totals',fields(jobGroups.weights))}</div>`}

function reportD(){return `${header('Job report register','Complete printable field-level snapshot.')}<div class="d-groups">${[['Order',jobGroups.order],['Dates',jobGroups.dates],['Assignments',jobGroups.assignments],['Part specifications',jobGroups.part],['Mill setup',jobGroups.setup],['Materials',jobGroups.weights]].map(([n,x])=>`<div class="d-group"><h3>${n}</h3>${fields(x)}</div>`).join('')}</div><div class="d-data">${card('Stages',table(['Station','Completed','Ordered','First','Last'],h.stages.map(x=>[x.label,num(x.done),num(j.quantity),stamp(x.first_at),stamp(x.last_at)])))}</div><div class="d-data split">${card('Timing',table(['Metric','Value','Definition'],tm))}${card('Scrap',table(['Metric','Value','Definition'],sc))}</div><div class="d-data">${notes}</div>`}
function historyA(){return `${header('Job history','Significant milestones and grouped production events for this job.')}<div class="split">${card('Manufacturing milestones',`<div class="event-list">${ke.journey.map((x,i)=>`<article class="event"><span class="event-dot">${i+1}</span><div><h3>${safe(x.label)}</h3><p>${safe(x.detail||'Pending milestone')}</p></div><time>${stamp(x.at)}</time></article>`).join('')}</div>`)}${card('Grouped events',eventsList())}</div><div class="a-section">${card('Group detail',table(['Event','Stage','Count','Reason','Tubes','Date'],eventRows()))}</div>`}
function historyB(){return `${header('Recorded job history','The event record presented in chronological document form.')}<div class="b-doc-section"><h3>Milestones</h3><div class="event-list">${ke.journey.map((x,i)=>`<article class="event"><span class="event-dot">${i+1}</span><div><h3>${safe(x.label)}</h3><p>${safe(x.detail||'Pending milestone')}</p></div><time>${stamp(x.at)}</time></article>`).join('')}</div></div><div class="b-doc-section"><h3>Grouped production and scrap</h3>${table(['Event','Department','Event count','Reason','Tubes','Recorded'],eventRows())}</div>`}
function historyC(){return `${header('Manufacturing activity journey','Stage-by-stage milestone history and grouped production batches.')}<div class="c-process">${ke.journey.slice(1,4).map((x,i)=>`<div class="c-step"><span class="stepno">Milestone 0${i+1}</span><h3>${safe(x.label)}</h3><p class="caption">${stamp(x.at)}</p><p class="caption" style="margin-top:12px">${safe(x.detail)}</p></div>`).join('')}</div><div class="c-section">${card('Batches and notable events',eventsList())}</div><div class="c-section">${card('Full grouped event index',table(['Event','Station','Count','Reason','Tubes','Latest'],eventRows()))}</div>`}
function historyD(){return `${header('Activity ledger','Compact, sortable-style group register without thousands of routine tube entries.')}<div class="d-data">${card('Lifecycle milestones',table(['Milestone','State','Date','Details'],ke.journey.map(x=>[x.label,x.state,stamp(x.at),x.detail||'Not recorded'])))}</div><div class="d-data">${card('Grouped production events',table(['Group','Stage','Events','Reason','Tubes','Latest'],eventRows()))}</div>`}
const routes=['overview','production','scrap','materials','report','history'];
const titles=['Overview','Production','Scrap','Materials','Job report','History'];
const renderers={A:{overview:overviewA,production:productionA,scrap:scrapA,materials:materialsA,report:reportA,history:historyA},B:{overview:overviewB,production:productionB,scrap:scrapB,materials:materialsB,report:reportB,history:historyB},C:{overview:overviewC,production:productionC,scrap:scrapC,materials:materialsC,report:reportC,history:historyC},D:{overview:overviewD,production:productionD,scrap:scrapD,materials:materialsD,report:reportD,history:historyD}};
function navigate(route){if(!routes.includes(route))route='overview';document.querySelector('#view').innerHTML=renderers[V][route]();document.querySelectorAll('[data-route]').forEach(el=>{if(el.closest('[data-nav]'))el.setAttribute('aria-current',el.dataset.route===route?'page':'false')});const url=new URL(window.location.href);url.searchParams.set('view',route);history.replaceState(null,'',url);window.scrollTo({top:0,behavior:'instant'});if(V==='D')document.querySelector('#d-page-title').textContent=titles[routes.indexOf(route)];if(V==='B')document.querySelector('#b-current').textContent=titles[routes.indexOf(route)];}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-route]');if(nav){navigate(nav.dataset.route);return}if(e.target.closest('[data-print]'))window.print()});
navigate(new URLSearchParams(location.search).get('view')||'overview');
</script></body></html>
